<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Mindful - Login</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#5e7860",
                        "background-light": "#f7f7f7",
                        "background-dark": "#181a18",
                        "sage": {
                            50: "#f4f6f4",
                            100: "#e9ede9",
                            500: "#5e7860",
                            600: "#4e6350"
                        },
                        "sand": {
                            50: "#fdfbf7",
                            100: "#f7f3eb"
                        }
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"],
                        "serif": ["Cormorant Garamond", "serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "1rem",
                        "lg": "2rem",
                        "xl": "3rem",
                        "full": "9999px",
                        "organic": "3rem 2rem 4rem 2rem"
                    },
                },
            },
        }
    </script>
<style>
        .botanical-pattern {
            background-color: transparent;
            background-image: radial-gradient(#5e786022 1px, transparent 1px);
            background-size: 40px 40px;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-sage-50 to-sand-100 dark:from-background-dark dark:to-black min-h-screen font-display text-[#141514] dark:text-gray-200 botanical-pattern">
<div class="relative flex h-auto min-h-screen w-full flex-col overflow-x-hidden">
<div class="layout-container flex h-full grow flex-col">
<!-- Navigation Header -->
<header class="flex items-center justify-between whitespace-nowrap border-b border-solid border-primary/10 px-6 md:px-20 py-4 backdrop-blur-sm bg-white/30 dark:bg-black/30">
<div class="flex items-center gap-3">
<div class="size-8 text-primary">
<svg fill="none" viewbox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
<path d="M42.1739 20.1739L27.8261 5.82609C29.1366 7.13663 28.3989 10.1876 26.2002 13.7654C24.8538 15.9564 22.9595 18.3449 20.6522 20.6522C18.3449 22.9595 15.9564 24.8538 13.7654 26.2002C10.1876 28.3989 7.13663 29.1366 5.82609 27.8261L20.1739 42.1739C21.4845 43.4845 24.5355 42.7467 28.1133 40.548C30.3042 39.2016 32.6927 37.3073 35 35C37.3073 32.6927 39.2016 30.3042 40.548 28.1133C42.7467 24.5355 43.4845 21.4845 42.1739 20.1739Z" fill="currentColor"></path>
</svg>
</div>
<h2 class="text-primary text-xl font-bold tracking-tight">Mindful</h2>
</div>
<div class="hidden md:flex items-center gap-8">
<a class="text-sm font-medium hover:text-primary transition-colors" href="#">Home</a>
<a class="text-sm font-medium hover:text-primary transition-colors" href="#">About</a>
<a class="text-sm font-medium hover:text-primary transition-colors" href="#">Resources</a>
<button class="bg-primary text-white text-sm font-bold px-6 py-2 rounded-full hover:bg-sage-600 transition-all">
                        Sign Up
                    </button>
</div>
<div class="md:hidden">
<span class="material-symbols-outlined cursor-pointer">menu</span>
</div>
</header>
<!-- Main Content -->
<main class="flex-1 flex flex-col items-center justify-center px-4 py-12">
<div class="w-full max-w-[500px] animate-fade-in">
<!-- Login Card -->
<div class="bg-white/80 dark:bg-zinc-900/80 backdrop-blur-md rounded-organic shadow-xl border border-white/40 p-8 md:p-12 relative overflow-hidden">
<!-- Abstract Organic Accent -->
<div class="absolute -top-12 -right-12 w-32 h-32 bg-primary/10 rounded-full blur-3xl"></div>
<div class="relative z-10 flex flex-col items-center">
<div class="mb-6 rounded-full bg-sage-50 p-4 inline-flex">
<span class="material-symbols-outlined text-primary text-3xl">spa</span>
</div>
<h1 class="font-serif text-4xl md:text-5xl text-center text-primary font-semibold mb-2">Welcome Back</h1>
<p class="text-gray-500 dark:text-gray-400 text-center mb-10">Continue your journey to wellness</p>
<form class="w-full space-y-6">
<!-- Email Input -->
<div class="relative">
<label class="block text-xs font-semibold text-primary/70 uppercase tracking-wider mb-2 ml-1">Email Address</label>
<div class="flex items-center bg-sand-100 dark:bg-zinc-800 rounded-xl px-4 py-1 border-2 border-transparent focus-within:border-primary/20 transition-all">
<span class="material-symbols-outlined text-primary/50 mr-3">mail</span>
<input class="w-full bg-transparent border-none focus:ring-0 text-gray-800 dark:text-gray-100 py-3 placeholder:text-gray-400" placeholder="yourname@email.com" type="email"/>
</div>
</div>
<!-- Password Input -->
<div class="relative">
<div class="flex justify-between items-center mb-2 ml-1">
<label class="text-xs font-semibold text-primary/70 uppercase tracking-wider">Password</label>
<a class="text-xs font-semibold text-primary hover:underline" href="#">Forgot?</a>
</div>
<div class="flex items-center bg-sand-100 dark:bg-zinc-800 rounded-xl px-4 py-1 border-2 border-transparent focus-within:border-primary/20 transition-all">
<span class="material-symbols-outlined text-primary/50 mr-3">lock</span>
<input class="w-full bg-transparent border-none focus:ring-0 text-gray-800 dark:text-gray-100 py-3 placeholder:text-gray-400" placeholder="••••••••" type="password"/>
<span class="material-symbols-outlined text-primary/50 cursor-pointer hover:text-primary">visibility</span>
</div>
</div>
<!-- Remember Me -->
<div class="flex items-center gap-2 px-1">
<input class="rounded text-primary focus:ring-primary h-4 w-4 border-primary/20 bg-sand-50" id="remember" type="checkbox"/>
<label class="text-sm text-gray-600 dark:text-gray-400 cursor-pointer" for="remember">Remember my journey</label>
</div>
<!-- Sign In Button -->
<button class="w-full bg-primary text-white py-4 rounded-xl font-bold text-lg hover:bg-sage-600 hover:shadow-lg hover:shadow-primary/20 transition-all flex items-center justify-center gap-2 mt-4" type="button">
                                    Sign In
                                    <span class="material-symbols-outlined text-xl">arrow_forward</span>
</button>
</form>
<div class="mt-8 flex flex-col items-center gap-4">
<p class="text-sm text-gray-500 dark:text-gray-400">
                                    New to Mindful? <a class="text-primary font-bold hover:underline" href="#">Create an account</a>
</p>
</div>
</div>
</div>
<!-- Inspirational Quote -->
<div class="mt-12 text-center">
<p class="font-serif italic text-xl md:text-2xl text-primary/70 leading-relaxed max-w-sm mx-auto">
                            "Take a deep breath. You are exactly where you need to be."
                        </p>
</div>
</div>
</main>
<!-- Footer Graphic -->
<footer class="w-full flex justify-center py-8">
<div class="flex gap-4 opacity-30 grayscale hover:grayscale-0 transition-all">
<div class="w-12 h-12 bg-primary rounded-full" data-alt="Abstract green organic leaf shape circle"></div>
<div class="w-12 h-12 bg-sand-100 rounded-full border border-primary" data-alt="Abstract sand colored circle outline"></div>
<div class="w-12 h-12 bg-primary/40 rounded-full" data-alt="Abstract translucent green circle"></div>
</div>
</footer>
</div>
</div>
</body></html>
